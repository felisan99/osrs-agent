[project]
name = "osrs-agent-backend"
version = "0.1.0"
description = "OSRS closed-domain agent: FastAPI + LangGraph backend (CRAG, deterministic price tools, Jev routing)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "mwparserfromhell>=0.7.2",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.10",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.12",
]

[tool.uv]
# Application, not a distributable library: no build backend, run via `uv run`.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits real network services (prices API, OpenRouter); deselect with -m 'not live'",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Spanish text in prompts/comments
