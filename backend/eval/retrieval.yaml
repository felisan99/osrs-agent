# Retrieval benchmark (English): does the right chunk come back for a player's question?
# Used by eval/retrieval_bench.py. No LLM, no Jev, no key: only the embedder, Postgres and the
# retriever, so a run takes seconds and costs nothing. It is what chunking and embedder changes
# are judged with (docs/rag-quality.md).
#
# Per case:
#   id, kind, q            what a player would ask
#   gold                   alternatives: a retrieved chunk is a hit if it satisfies ANY entry
#     page | page_re       exact title of the wiki page (or a regex on the title)
#     section              regex on the chunk's section path ('^$' = the lead; omitted = any)
#     has                  regexes that must ALL match the chunk text (case-sensitive unless (?i))
#     source               regexes that must appear in the page's raw wikitext (--check-gold uses
#                          them to prove the label is true, independently of how it is rendered)
#   notes                  why the case exists
#
# Cases were written from the player's side, before looking at what the retriever returned, and
# every `source` was checked against the cached wikitext (python -m eval.retrieval_bench
# --check-gold). `section` is what separates "the page's drop table" from "the lead mentions the
# item": a chunk of the right page but the wrong section does not count in the strict metric.

version: 1

cases:
  # ------------------------------------------------------------------ drops: monster -> items
  - id: drops-moss-giant-list
    kind: drops
    q: What does a moss giant drop?
