# Evaluation set (SPEC §12). Used by eval/run_eval.py (M8) and by the M4 retrieval check.
#
# Per case:
#   id, lang, question
#   query_en          hand-written English rewrite of a Spanish question: what a perfect rewrite
#                     step would produce (measures retrieval apart from the rewriting LLM)
#   intent_esperado   one of app.graph.intents.Intent
#   profile | player_state   optional player snapshot (profiles below, or inline, SPEC §5)
#   history           prior turns [{role, content}] for follow-up questions
#   corpus            answerable | unanswerable | n/a   (is the answer in the ingested wiki?)
#   gold_pages        exact wiki page titles that hold the answer (passage recall)
#   evidence          substrings; at least one must appear in the retained passages
#   behavior          answer | no_evidence | clarify | refuse   (what the reply must do; judged by Jev)
#   expected_facts    all must appear in the answer (case-insensitive; "a|b" = either spelling)
#   avoid_facts       none may appear in the answer
#   avoid_patterns    regexes none may match (numbers that must not be invented)
#   tools_expected    tools the agent must call (names from app.tools.registry)
#   notes             why the case exists
#
# Gold labels were checked against the loaded corpus on 2026-10-14 (run_eval.py --check-gold).

version: 1

